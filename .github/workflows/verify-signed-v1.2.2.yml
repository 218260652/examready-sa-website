name: Verify historical production-signed ExamReady SA v1.2.2
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ExamReadySA-v1.2.2.apk'
      - '.github/workflows/verify-signed-v1.2.2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: examready-publish-v122
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;34.0.0'
      - name: Validate checksum, signing identity and APK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, re, os
          apk=Path('downloads/ExamReadySA-v1.2.2.apk')
          expected_hash='e5a846ae56df82b7ed5bd4ce12e593c81be6c39cf49377ada32126563469c226'
          expected_signer='dd4c342fcfa66ac2d9b7b37c1a4cd55d4c998be78dbe2479489b031d6fe38dc2'
          assert apk.is_file() and apk.stat().st_size==9597905, 'Incorrect APK or file size'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected_hash, 'APK checksum mismatch'
          tools=os.environ['ANDROID_HOME']+'/build-tools/34.0.0/'
          v=subprocess.run([tools+'apksigner','verify','--verbose','--print-certs',str(apk)],capture_output=True,text=True,check=True).stdout
          match=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',v)
          assert match and match.group(1)==expected_signer,'Unknown signing certificate'
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in v, 'Signature not valid'
          badging=subprocess.run([tools+'aapt','dump','badging',str(apk)],capture_output=True,text=True,check=True).stdout
          match=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",badging,re.MULTILINE)
          assert match is not None, 'Cannot read signed APK package metadata'
          assert match.group(1)=='za.co.examready.prototype', 'Wrong package'
          assert match.group(2)=='10', 'Wrong APK version code'
          assert match.group(3)=='1.2.2', 'Wrong APK version name'
          print('Production-signed v1.2.2 package, code, certificate and checksum verified.')
          PY

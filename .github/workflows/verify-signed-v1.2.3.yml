name: Publish verified production-signed ExamReady SA v1.2.3
on:
  push:
    branches: [main]
    paths:
      - 'downloads/ExamReadySA-v1.2.3.apk'
permissions:
  contents: write
concurrency:
  group: examready-publish-v123
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;34.0.0'
      - name: Validate checksum, signing identity and APK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, re, os
          apk=Path('downloads/ExamReadySA-v1.2.3.apk')
          expected_hash='eef26af0d2591c8051bba94658b158e55ab295b40ccb7e499a4906739cd46200'
          expected_signer='dd4c342fcfa66ac2d9b7b37c1a4cd55d4c998be78dbe2479489b031d6fe38dc2'
          assert apk.is_file() and apk.stat().st_size==9597905, 'Incorrect APK or file size'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected_hash, 'APK checksum mismatch'
          tools=os.environ['ANDROID_HOME']+'/build-tools/34.0.0/'
          v=subprocess.run([tools+'apksigner','verify','--verbose','--print-certs',str(apk)],capture_output=True,text=True,check=True).stdout
          match=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',v)
          assert match and match.group(1)==expected_signer,'Unknown signing certificate'
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in v, 'Signature not valid'
          badging=subprocess.run([tools+'aapt','dump','badging',str(apk)],capture_output=True,text=True,check=True).stdout
          match=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",badging,re.MULTILINE)
          assert match is not None, 'Cannot read signed APK package metadata'
          assert match.group(1)=='za.co.examready.prototype', 'Wrong package'
          assert match.group(2)=='11', 'Wrong APK version code'
          assert match.group(3)=='1.2.3', 'Wrong APK version name'
          print('Production-signed v1.2.3 package, code, certificate and checksum verified.')
          PY
      - name: Switch website to new verified APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('updates/latest.json')
          d=json.loads(p.read_text())
          d.update(
             versionName='1.2.3',
             versionCode=11,
             apkPath='downloads/ExamReadySA-v1.2.3.apk',
             sizeBytes=9597905,
             sha256='eef26af0d2591c8051bba94658b158e55ab295b40ccb7e499a4906739cd46200',
             releaseNotes='Non-personalized, G-rated advertisements for eligible teens 13–17 and adults, with updated privacy controls.'
          )
          p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('updates/android.json')
          d=json.loads(p.read_text())
          assert d['packageName']=='za.co.examready.prototype'
          d.update(latestVersionCode=11,latestVersionName='1.2.3',minimumSupportedVersionCode=1,
             message='ExamReady SA v1.2.3 is available. Teen learners aged 13–17 can see privacy-protected, non-personalized G-rated banners where approved; adults can use optional advertising. Version 1.2.2 can update in place.')
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json updates/android.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified permanent-signed ExamReady SA v1.2.3'
            git push origin HEAD:main
          fi
